
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const nameInput = $("nameInput");
  const dateInput = $("dateInput");
  const statusBox = $("status");
  const qrBox = $("qrcode");

  const DEFAULT_ID = "LW-TUR-2026-001";
  const params = new URLSearchParams(location.search);
  const requestedId = params.get("id");
  const isPublicView = Boolean(requestedId);

  function formatDate(value) {
    if (!value) return "Date of Issue";

    const parsed = new Date(value + "T12:00:00");

    if (Number.isNaN(parsed.getTime())) return value;

    return parsed.toLocaleDateString(undefined, {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
  }

  function updatePreview() {
    $("studentName").textContent =
      nameInput.value.trim() || "Student Name";

    $("displayDate").textContent = formatDate(dateInput.value);
  }

  function makeQR() {
    qrBox.innerHTML = "";

    if (typeof QRCode === "undefined") {
      if (statusBox) {
        statusBox.textContent =
          "QR library failed to load. Check your internet connection.";
      }
      return;
    }

    // A QR code must point to an online page, not a local file.
    if (location.protocol === "file:") {
      if (statusBox) {
        statusBox.textContent =
          "Preview only: publish this HTML online before generating a scannable QR.";
      }
      return;
    }

    const url = new URL(location.href);

    // Remove previous parameters before creating the public certificate URL.
    url.search = "";
    url.hash = "";

    url.searchParams.set("id", $("certId").textContent.trim() || DEFAULT_ID);
    url.searchParams.set(
      "name",
      nameInput.value.trim() || "Student Name"
    );
    url.searchParams.set("date", dateInput.value || "");

    new QRCode(qrBox, {
      text: url.href,
      width: 90,
      height: 90,
      colorDark: "#13342b",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  function showPublicCertificate() {
    document.body.classList.add("public-view");

    // FIX: use the name and date encoded into this certificate's QR URL.
    // Do not load the hard-coded "Student Name" record.
    const studentName = params.get("name");
    const issueDate = params.get("date");

    if (!studentName) {
      document.body.innerHTML = `
        <main style="max-width:650px;margin:50px auto;padding:25px;
          text-align:center;font-family:Arial,sans-serif;background:white">
          <h1>Certificate Details Missing</h1>
          <p>This QR code does not contain the student's name.</p>
          <p>Please generate a new QR code from the certificate editor.</p>
          <p>Language Whispers</p>
        </main>`;
      return;
    }

    $("studentName").textContent = studentName;
    $("certId").textContent = requestedId;
    $("displayDate").textContent = formatDate(issueDate);

    // These image files must exist online alongside the HTML.
    // Locally uploaded images cannot automatically be shared with scanners.
    $("logo").src = "lan.png";
    $("studentPhoto").src = "student.jpg";

    // Preserve the existing certificate scores.
    // The QR contains the student's name and date, not editable score data.
    return;
  }

  function readImage(inputId, imageId) {
    $(inputId).addEventListener("change", function () {
      const file = this.files && this.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        statusBox.textContent = "Please select a valid image file.";
        return;
      }

      const reader = new FileReader();

      reader.onload = event => {
        $(imageId).src = event.target.result;

        statusBox.textContent =
          "Image preview updated. To show this uploaded image after scanning, upload it to your website and use its public image URL.";
      };

      reader.readAsDataURL(file);
    });
  }

  function saveRecord() {
    const record = {
      id: $("certId").textContent.trim() || DEFAULT_ID,
      name: nameInput.value.trim() || "Student Name",
      date: dateInput.value,
      note: "This is a local export. It does not publish the record online."
    };

    const blob = new Blob([JSON.stringify(record, null, 2)], {
      type: "application/json"
    });

    const downloadUrl = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = downloadUrl;
    link.download = record.id + ".json";
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);

    statusBox.textContent =
      "Record downloaded. The QR now contains the current name and date. Uploaded images still need public URLs.";
  }

  if (isPublicView) {
    showPublicCertificate();
    return;
  }

  // Editor view
  $("certId").textContent = DEFAULT_ID;

  const now = new Date();

  dateInput.value = [
    now.getFullYear(),
    String(now.getMonth() + 1).padStart(2, "0"),
    String(now.getDate()).padStart(2, "0")
  ].join("-");

  nameInput.addEventListener("input", updatePreview);
  dateInput.addEventListener("change", updatePreview);

  $("qrButton").addEventListener("click", () => {
    updatePreview();
    makeQR();

    if (location.protocol !== "file:") {
      statusBox.textContent =
        "QR generated using the current student name and date. Scan it after publishing this page online.";
    }
  });

  $("saveButton").addEventListener("click", saveRecord);

  readImage("logoInput", "logo");
  readImage("photoInput", "studentPhoto");

  updatePreview();
  makeQR();
})();
</script>
